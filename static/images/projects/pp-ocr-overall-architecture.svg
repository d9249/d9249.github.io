<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
<title id="title">요청·작업·추론의 분리</title>
<desc id="desc">선택한 기능과 배포 구성에 따라 연결</desc>
<!-- Paper and ink values mirror DESIGN.md and src/styles/tokens.css. -->
<style>
  svg { --paper: #f2ede3; --sheet: #fbf8f1; --ink: #16171b; --muted: #5c5850; --rule: #a6a095; }
  .canvas { fill: var(--paper); }
  .node rect { fill: var(--sheet); stroke: var(--rule); stroke-width: 1.5; }
  text { fill: var(--ink); font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; text-anchor: middle; }
  .heading { font-size: 30px; font-weight: 700; }
  .subheading, .detail { font-size: 20px; fill: var(--muted); }
  .label { font-size: 26px; font-weight: 700; }
  .link { fill: none; stroke: var(--muted); stroke-width: 2; marker-end: url(#arrow); }
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8Z" fill="#5c5850"/></marker></defs>
<rect class="canvas" width="640" height="960" rx="8"/>
<text class="heading" x="320" y="55"><tspan x="320">요청·작업·추론의 분리</tspan></text>
<text class="subheading" x="320" y="90"><tspan x="320">선택한 기능과 배포 구성에 따라 연결</tspan></text>
<path class="link" d="M320 240V280"/>
<path class="link" d="M165 380V440"/>
<path class="link" d="M475 380V440"/>
<path class="link" d="M290 510H350"/>
<path class="link" d="M165 580V650"/>
<path class="link" d="M320 770V830"/>
<g class="node"><rect x="40" y="130" width="560" height="110" rx="8"/><text class="label" x="320" y="170"><tspan x="320">웹 · REST API · MCP</tspan></text><text class="detail" x="320" y="204"><tspan x="320">사용자 화면과 외부 시스템의 요청</tspan></text></g>
<g class="node"><rect x="40" y="280" width="560" height="100" rx="8"/><text class="label" x="320" y="320"><tspan x="320">공통 API</tspan></text><text class="detail" x="320" y="354"><tspan x="320">인증 · 권한 · 업로드 검증</tspan></text></g>
<g class="node"><rect x="40" y="440" width="250" height="140" rx="8"/><text class="label" x="165" y="480"><tspan x="165">작업 워커</tspan></text><text class="detail" x="165" y="514"><tspan x="165">큐 · 배치 · 내보내기</tspan></text><text class="detail" x="165" y="542"><tspan x="165">취소 · 재개 · 분산</tspan></text></g>
<g class="node"><rect x="350" y="440" width="250" height="140" rx="8"/><text class="label" x="475" y="480"><tspan x="475">추론 서빙</tspan></text><text class="detail" x="475" y="514"><tspan x="475">OCR · 레이아웃</tspan></text><text class="detail" x="475" y="542"><tspan x="475">표 · 문서 모델</tspan></text></g>
<g class="node"><rect x="40" y="650" width="560" height="120" rx="8"/><text class="label" x="320" y="690"><tspan x="320">작업·이력·파일 저장</tspan></text><text class="detail" x="320" y="724"><tspan x="320">PostgreSQL · Redis · S3 호환 저장소</tspan></text><text class="detail" x="320" y="752"><tspan x="320">구성에 따라 로컬 저장도 선택</tspan></text></g>
