<svg xmlns="http://www.w3.org/2000/svg" width="600" height="920" viewBox="0 0 600 920" role="img" aria-labelledby="title desc">
  <title id="title">Dream-RSI의 discovery history replay loop</title>
  <desc id="desc">온라인 탐색이 discovery tree를 기록하고, tree는 replay simulator가 된다. 그 안에서 후보 탐색 정책을 재평가해 다음 정책을 고른 후 다시 온라인 탐색으로 배포하는 반복 구조다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081527"/><stop offset="1" stop-color="#10233b"/></linearGradient>
    <linearGradient id="online" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1677ff"/><stop offset="1" stop-color="#54a0ff"/></linearGradient>
    <linearGradient id="replay" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d9b86"/><stop offset="1" stop-color="#55c4af"/></linearGradient>
    <linearGradient id="dream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8457e6"/><stop offset="1" stop-color="#b08cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9fc1e8"/></marker>
    <style>
      .eyebrow{font:600 13px system-ui,sans-serif;letter-spacing:1.4px;fill:#9fc1e8}.head{font:700 28px system-ui,sans-serif;fill:#f4f8ff}.sub{font:400 15px system-ui,sans-serif;fill:#c5d7ed}.num{font:700 14px system-ui,sans-serif;fill:#dbeaff}.cardtitle{font:700 20px system-ui,sans-serif;fill:#fff}.body{font:400 15px system-ui,sans-serif;fill:#eef6ff}.small{font:400 13px system-ui,sans-serif;fill:#d4e4f7}.tag{font:600 12px system-ui,sans-serif;fill:#e7f1ff}.loop{font:600 13px system-ui,sans-serif;fill:#8ed6cb}
    </style>
  </defs>
  <rect width="600" height="920" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" class="eyebrow">DREAM-RSI · META-EXPLORATION LOOP</text>
  <text x="48" y="96" class="head">기록된 탐색을 다시 실행하지 않고</text>
  <text x="48" y="130" class="head">다음 탐색 정책을 고르는 법</text>
  <text x="48" y="160" class="sub">실제 실행은 online에서 한 번, 후보 평가는 replay 안에서 여러 번</text>

  <path d="M300 307 L300 340" stroke="#9fc1e8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M300 497 L300 530" stroke="#9fc1e8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M300 687 L300 720" stroke="#9fc1e8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M122 809 C34 809 34 218 122 218" fill="none" stroke="#56c8b6" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <text x="56" y="516" class="loop" transform="rotate(-90 56 516)">history가 늘며 replay world도 확장</text>

  <g>
    <rect x="120" y="198" width="360" height="110" rx="18" fill="url(#online)"/>
    <circle cx="156" cy="234" r="18" fill="#ffffff" fill-opacity=".22"/>
    <text x="150" y="239" class="num">1</text>
    <text x="190" y="239" class="cardtitle">온라인 탐색</text>
    <text x="150" y="269" class="body">현재 policy가 discovery agent를 안내</text>
    <text x="150" y="291" class="small">branch · 병렬 실행 · 종료 시점을 결정하고</text>
  </g>
  <g>
    <rect x="120" y="340" width="360" height="157" rx="18" fill="url(#replay)"/>
    <circle cx="156" cy="376" r="18" fill="#ffffff" fill-opacity=".22"/>
    <text x="150" y="381" class="num">2</text>
    <text x="190" y="381" class="cardtitle">discovery tree → replay simulator</text>
    <text x="150" y="411" class="body">각 attempt의 observation·artifact·score를 보존</text>
    <text x="150" y="435" class="small">이미 실행된 outcome만 reveal하므로</text>
    <text x="150" y="456" class="small">새 discovery-agent 호출은 발생하지 않음</text>
    <rect x="150" y="467" width="143" height="19" rx="9" fill="#fff" fill-opacity=".17"/><text x="160" y="481" class="tag">realized search space</text>
  </g>
  <g>
    <rect x="120" y="530" width="360" height="157" rx="18" fill="url(#dream)"/>
    <circle cx="156" cy="566" r="18" fill="#ffffff" fill-opacity=".22"/>
    <text x="150" y="571" class="num">3</text>
    <text x="190" y="571" class="cardtitle">오프라인 dreaming</text>
    <text x="150" y="601" class="body">후보 policy가 같은 tree를 다르게 순회</text>
    <text x="150" y="625" class="small">quality · 대표 실행 cost · parallelism을</text>
    <text x="150" y="646" class="small">replay score로 비교해 빠르게 feedback</text>
    <rect x="150" y="657" width="164" height="19" rx="9" fill="#fff" fill-opacity=".17"/><text x="160" y="671" class="tag">off-policy evaluation</text>
  </g>
  <g>
    <rect x="120" y="720" width="360" height="89" rx="18" fill="#17395f" stroke="#74aeea" stroke-width="1.5"/>
    <circle cx="156" cy="756" r="18" fill="#2d75bc"/>
    <text x="150" y="761" class="num">4</text>
    <text x="190" y="756" class="cardtitle">선택 · 재배포 · 다음 world 추가</text>
    <text x="150" y="787" class="small">현재 policy도 후보에 포함해 replay 기준 열화를 막는다</text>
  </g>
  <rect x="48" y="850" width="504" height="36" rx="10" fill="#102a47"/>
  <text x="68" y="873" class="small">핵심 제약: replay는 history가 실제로 도달한 branch 안에서만 정확하다</text>
</svg>
