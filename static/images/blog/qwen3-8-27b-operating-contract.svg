<svg xmlns="http://www.w3.org/2000/svg" width="760" height="860" viewBox="0 0 760 860" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.8-27B 에이전트 실행 운영 구조</title>
  <desc id="desc">텍스트, 이미지, 영상 입력이 Qwen3.8-27B 비전 언어 모델로 들어가며, 추론 제어와 문맥 및 배포 설정이 이어지는 세로 구조도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c3faa"/><stop offset="1" stop-color="#2969d8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#16306b" flood-opacity=".15"/></filter>
  </defs>
  <rect width="760" height="860" fill="url(#bg)"/>
  <text x="60" y="72" fill="#122755" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="31" font-weight="700">Qwen3.8-27B의 에이전트 실행 운영 표면</text>
  <text x="60" y="106" fill="#51617e" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17">모델 하나가 아니라 입력·추론·문맥·배포를 함께 다루는 계약</text>

  <rect x="60" y="146" width="640" height="112" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="60" y="146" width="11" height="112" rx="5" fill="#77a6ff"/>
  <text x="98" y="188" fill="#163164" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700">01 · 멀티모달 입력</text>
  <text x="98" y="223" fill="#283b62" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="23" font-weight="700">텍스트 · 이미지 · 영상</text>
  <path d="M380 278 L380 302" stroke="#5275b9" stroke-width="3"/><path d="M370 294 L380 304 L390 294" fill="none" stroke="#5275b9" stroke-width="3"/>

  <rect x="60" y="324" width="640" height="144" rx="18" fill="url(#core)" filter="url(#shadow)"/>
  <text x="98" y="370" fill="#ccdcff" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700">02 · 핵심 모델</text>
  <text x="98" y="409" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="30" font-weight="700">27B Vision-Language Model</text>
  <text x="98" y="441" fill="#dce7ff" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17">Vision Encoder + Causal Language Model</text>
  <path d="M380 488 L380 512" stroke="#5275b9" stroke-width="3"/><path d="M370 504 L380 514 L390 504" fill="none" stroke="#5275b9" stroke-width="3"/>

  <rect x="60" y="534" width="640" height="126" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="60" y="534" width="11" height="126" rx="5" fill="#5fc5b0"/>
  <text x="98" y="575" fill="#163164" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700">03 · 추론 실행 제어</text>
  <text x="98" y="611" fill="#283b62" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" font-weight="700">thinking 기본값 · reasoning_effort · preserve_thinking</text>
  <text x="98" y="638" fill="#5b6a86" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16">정확도·속도·비용과 대화 간 추론 문맥을 요청별로 조절</text>
  <path d="M380 680 L380 704" stroke="#5275b9" stroke-width="3"/><path d="M370 696 L380 706 L390 696" fill="none" stroke="#5275b9" stroke-width="3"/>

  <rect x="60" y="726" width="640" height="92" rx="18" fill="#172d5d" filter="url(#shadow)"/>
  <text x="98" y="764" fill="#bcd1ff" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" font-weight="700">04 · 문맥 및 배포</text>
  <text x="98" y="796" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="700">네이티브 262K → YaRN으로 최대 1M · vLLM / SGLang / TokenSpeed</text>
</svg>
