<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">U-OPSD 합의 기반 온폴리시 자기 증류 루프</title>
  <desc id="desc">문제에서 여러 온폴리시 rollout을 생성하고, 다수결과 self-consistency threshold로 pseudo-solution을 선택한다. 같은 모델을 teacher와 student로 다르게 조건화한 뒤, 다수결에 불일치한 rollout prefix에 token-level forward KL 증류를 적용한다.</desc>
  <defs>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#172033}
      .sub{font:500 19px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#526071}
      .step{font:700 18px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#fff}
      .head{font:700 27px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#172033}
      .body{font:500 19px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#344256}
      .small{font:500 17px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#526071}
      .chip{font:700 16px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#126f54}
      .metric{font:700 19px ui-monospace,'SFMono-Regular',Menlo,monospace;fill:#126f54}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172033" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6.5 L0,13 Z" fill="#5c7895"/></marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6.5 L0,13 Z" fill="#2d8a6d"/></marker>
    <marker id="arrowRed" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6.5 L0,13 Z" fill="#b75b4b"/></marker>
  </defs>
  <rect width="1400" height="820" fill="#fbfcfe"/>
  <text x="70" y="75" class="title">U-OPSD: 합의가 만든 pseudo-solution으로 자기 오류를 교정한다</text>
  <text x="70" y="112" class="sub">외부 정답·verifier·더 큰 teacher 없이, 모델 자신의 rollout 합의와 불일치만 학습 신호로 사용</text>

  <path d="M330 304 H405" stroke="#5c7895" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M725 304 H800" stroke="#5c7895" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="260" height="198" rx="24" fill="#eef3f8" stroke="#c9d6e3" stroke-width="2"/>
    <circle cx="110" cy="248" r="21" fill="#315d88"/><text x="103" y="255" class="step">1</text>
    <text x="148" y="257" class="head">표본 생성</text>
    <text x="102" y="303" class="body">문제 x마다 현재 모델이</text>
    <text x="102" y="332" class="body">여러 on-policy rollout 생성</text>
    <rect x="102" y="351" width="177" height="31" rx="15" fill="#dce9f4"/>
    <text x="121" y="373" class="metric">기본값 G = 8</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="405" y="172" width="320" height="264" rx="24" fill="#eff8f3" stroke="#b7dcca" stroke-width="2"/>
    <circle cx="445" cy="215" r="21" fill="#2d8a6d"/><text x="438" y="222" class="step">2</text>
    <text x="483" y="224" class="head">합의 판정</text>
    <text x="438" y="270" class="body">최종 답을 정규화한 뒤</text>
    <text x="438" y="299" class="body">다수결로 pseudo-answer 선택</text>
    <text x="438" y="338" class="small">승자 비율이 임계값을 넘으면</text>
    <rect x="438" y="360" width="229" height="45" rx="14" fill="#d9efdf"/>
    <text x="463" y="390" class="metric">c(x) ≥ τ = 0.5</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="800" y="160" width="300" height="288" rx="24" fill="#f4f5fb" stroke="#cdd2e5" stroke-width="2"/>
    <circle cx="840" cy="204" r="21" fill="#5c65a1"/><text x="833" y="211" class="step">3</text>
    <text x="878" y="213" class="head">rollout 분할</text>
    <rect x="834" y="244" width="232" height="70" rx="13" fill="#dff1e7"/>
    <text x="854" y="274" class="chip">합의 rollout</text>
    <text x="854" y="299" class="small">pseudo-solution 후보</text>
    <rect x="834" y="336" width="232" height="76" rx="13" fill="#fde9e5"/>
    <text x="854" y="367" style="font:700 16px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#9a3f30">불일치 rollout</text>
    <text x="854" y="393" class="small">교정할 trajectory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1120" y="190" width="225" height="138" rx="22" fill="#eff8f3" stroke="#b7dcca" stroke-width="2"/>
    <text x="1145" y="232" class="head">Teacher</text>
    <text x="1145" y="264" class="small">문제 + 합의 trace</text>
    <text x="1145" y="290" class="small">동일 모델·gradient 차단</text>
    <text x="1145" y="313" class="small">합의 rollout을 기준으로 평가</text>
    <rect x="1120" y="395" width="225" height="138" rx="22" fill="#eef3f8" stroke="#c9d6e3" stroke-width="2"/>
    <text x="1145" y="437" class="head">Student</text>
    <text x="1145" y="469" class="small">문제만 입력</text>
    <text x="1145" y="495" class="small">불일치 rollout prefix를 재평가</text>
    <text x="1145" y="518" class="small">배포 시 사용할 정책</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="300" y="555" width="800" height="180" rx="26" fill="#fff8ed" stroke="#edcf9d" stroke-width="2"/>
    <circle cx="342" cy="599" r="21" fill="#b8752c"/><text x="335" y="606" class="step">4</text>
    <text x="380" y="608" class="head">불일치 prefix에서만 token-level 증류</text>
    <text x="342" y="652" class="body">Teacher의 조건부 next-token 분포를 Student가 맞추도록 forward KL 최소화</text>
    <text x="342" y="687" class="small">합의가 부족한 문제와 모든 rollout이 이미 합의한 문제는 update를 건너뜀</text>
    <rect x="342" y="702" width="297" height="24" rx="12" fill="#f8e5c4"/>
    <text x="357" y="720" class="small">목표: 확신 있게 갈린 경로만 교정</text>
  </g>

  <text x="71" y="785" class="small">근거: Li et al., “On-Policy Self-Distillation without Any Supervision” (arXiv:2608.06296v2), §3.2·Algorithm 1·§4.1.</text>
</svg>