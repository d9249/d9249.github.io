<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
  <title id="title">HarnessRouter Community Edition 런타임 구조</title>
  <desc id="desc">UHP 및 Responses 호환 요청이 콘솔, 게이트웨이, 러너를 지나 세션별 에이전트 하네스에서 실행되는 구조. 데이터는 /data 볼륨에 저장되며 모델 제공자 호출은 외부로 나간다. 세션별 OS 사용자와 작업공간은 분리되지만 컨테이너는 공유한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b" />
    </marker>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #0f172a; }
      .kicker { font-size: 16px; font-weight: 700; letter-spacing: .08em; fill: #1d4ed8; }
      .heading { font-size: 24px; font-weight: 750; }
      .title { font-size: 25px; font-weight: 750; }
      .body { font-size: 18px; fill: #475569; }
      .small { font-size: 16px; fill: #475569; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="760" height="1080" fill="#f8fafc" />
  <text x="48" y="42" class="kicker">에이전트 실행 런타임</text>
  <text x="48" y="76" class="heading">하나의 API, 세션별 하네스 실행</text>

  <rect x="154" y="98" width="452" height="76" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="380" y="130" text-anchor="middle" class="title">애플리케이션 클라이언트</text>
  <text x="380" y="155" text-anchor="middle" class="small">UHP / Responses 호환 task 요청</text>

  <rect x="38" y="198" width="496" height="786" rx="28" fill="#eef2ff" stroke="#94a3b8" stroke-width="2" />
  <text x="66" y="232" class="kicker">HARNESSROUTER COMMUNITY EDITION</text>
  <text x="66" y="261" class="small">하나의 Docker 컨테이너</text>

  <path d="M380 175 V292" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="78" y="298" width="418" height="86" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" />
  <text x="102" y="334" class="title">Console :3000</text>
  <text x="102" y="362" class="body">브라우저 + API 프록시 · 유일한 공개 포트</text>

  <path d="M287 384 V418" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="78" y="424" width="418" height="92" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" />
  <text x="102" y="461" class="title">Gateway :8080</text>
  <text x="102" y="489" class="body">task · session · stream · cancel</text>

  <path d="M287 516 V548" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="78" y="554" width="418" height="86" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" />
  <text x="102" y="590" class="title">Runner :8081</text>
  <text x="102" y="618" class="body">요청한 harness CLI 실행 · 내부 통신</text>

  <path d="M287 640 V671" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="78" y="677" width="418" height="132" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" />
  <text x="102" y="708" class="title">세션별 harness 프로세스</text>
  <rect x="98" y="724" width="183" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd" />
  <text x="112" y="751" font-size="19" font-weight="700">세션 A · Codex</text>
  <text x="112" y="775" font-size="14" fill="#475569">OS 사용자 A · workspace A</text>
  <rect x="293" y="724" width="183" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd" />
  <text x="307" y="751" font-size="19" font-weight="700">세션 B · Claude Code</text>
  <text x="307" y="775" font-size="14" fill="#475569">OS 사용자 B · workspace B</text>

  <path d="M287 809 V843" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-muted)" />
  <rect x="78" y="850" width="418" height="82" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2" />
  <text x="102" y="884" class="title">/data · 영속 볼륨</text>
  <text x="102" y="912" class="body">SQLite · 세션 기록 · 파일 · 작업공간</text>

  <rect x="560" y="694" width="172" height="98" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2" />
  <text x="646" y="731" text-anchor="middle" font-size="20" font-weight="750">모델 제공자</text>
  <text x="646" y="760" text-anchor="middle" class="small">설정한 API key로 호출</text>
  <path d="M496 744 H552" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="66" y="946" width="440" height="24" rx="10" fill="#fef3c7" />
  <text x="286" y="964" text-anchor="middle" font-size="15" font-weight="700" fill="#854d0e">OS 사용자 + workspace 분리 · Docker 컨테이너는 공유</text>

  <text x="48" y="1034" class="small">실행은 로컬 컨테이너에서, 추론 요청은 설정한 제공자로.</text>
</svg>
