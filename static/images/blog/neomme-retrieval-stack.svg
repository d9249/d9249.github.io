<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1160" viewBox="0 0 660 1160" role="img" aria-labelledby="title desc">
  <title id="title">NeoMME 단일 인코더 기반 시각 문서 검색 구조</title>
  <desc id="desc">텍스트 토큰과 32 곱하기 32 이미지 패치가 NeoMME 공유 양방향 인코더로 들어가 dense와 late-interaction 임베딩을 만들고 시각 문서 검색에 활용되는 세로 구조도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#F3F0FF"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5B36B9"/><stop offset="1" stop-color="#7E5BEA"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#25144D" flood-opacity=".12"/></filter>
    <style>
      .t { font-family: "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1F2937; }
      .small { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; font-weight: 500; fill: #4B5563; }
      .white { fill: #fff; }
      .whitebody { fill: #EAE5FF; }
    </style>
  </defs>
  <rect width="660" height="1160" rx="32" fill="url(#bg)"/>
  <text class="t" x="52" y="66" font-size="31" font-weight="800">NeoMME: 한 번의 인코딩, 두 가지 검색 표현</text>
  <text class="t body" x="52" y="98">텍스트와 원본 이미지 패치를 하나의 양방향 경로에 넣는다</text>

  <text class="t small" x="52" y="154" fill="#6B5D89">01 · 입력</text>
  <g filter="url(#shadow)">
    <rect x="52" y="176" width="250" height="132" rx="20" fill="#FFFFFF" stroke="#B8AECF" stroke-width="2"/>
    <rect x="358" y="176" width="250" height="132" rx="20" fill="#FFFFFF" stroke="#B8AECF" stroke-width="2"/>
  </g>
  <text class="t label" x="177" y="230" text-anchor="middle">텍스트 토큰</text>
  <text class="t body" x="177" y="263" text-anchor="middle">다국어 · 코드 · 수식</text>
  <text class="t label" x="483" y="230" text-anchor="middle">원본 이미지</text>
  <text class="t body" x="483" y="263" text-anchor="middle">32×32 패치로 분할</text>
  <path d="M177 308 V350 H330 V420" fill="none" stroke="#6B5D89" stroke-width="3"/>
  <path d="M483 308 V350 H330" fill="none" stroke="#6B5D89" stroke-width="3"/>
  <polygon points="320,420 340,420 330,442" fill="#6B5D89"/>

  <text class="t small" x="52" y="475" fill="#6B5D89">02 · 공유 backbone</text>
  <g filter="url(#shadow)"><rect x="52" y="497" width="556" height="178" rx="24" fill="url(#core)"/></g>
  <text class="t label white" x="330" y="557" text-anchor="middle">NeoMME 양방향 Transformer</text>
  <text class="t body whitebody" x="330" y="593" text-anchor="middle">별도 vision tower · causal decoder 없이</text>
  <text class="t body whitebody" x="330" y="621" text-anchor="middle">모든 레이어를 텍스트와 이미지가 공유</text>

  <text class="t small" x="52" y="730" fill="#6B5D89">03 · 동일 forward pass의 두 출력</text>
  <g filter="url(#shadow)">
    <rect x="52" y="752" width="556" height="112" rx="20" fill="#FFF5E1" stroke="#DEAF50" stroke-width="2"/>
    <rect x="52" y="884" width="556" height="112" rx="20" fill="#FFF0F3" stroke="#E29AA8" stroke-width="2"/>
  </g>
  <text class="t label" x="86" y="798">Dense 임베딩</text>
  <text class="t body" x="86" y="834">cosine similarity · ANN 후보 검색</text>
  <text class="t label" x="86" y="930">Late-interaction 임베딩</text>
  <text class="t body" x="86" y="966">MeanMaxSim · 토큰/패치 단위 세밀 매칭</text>

  <text class="t small" x="52" y="1044" fill="#6B5D89">04 · 활용 경로</text>
  <g filter="url(#shadow)"><rect x="52" y="1066" width="556" height="58" rx="17" fill="#E6F6EF" stroke="#78B997" stroke-width="2"/></g>
  <text class="t label" x="330" y="1104" text-anchor="middle">Visual RAG · 페이지 검색 → VLM 생성</text>
</svg>
