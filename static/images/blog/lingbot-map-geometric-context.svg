<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LingBot-Map의 스트리밍 geometric context 구조</title>
  <desc id="desc">현재 프레임이 anchor context, pose-reference window, trajectory memory를 참조해 pose와 depth를 예측하는 구조도</desc>
  <defs>
    <style>
      .title{font:700 32px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#10233f}.sub{font:400 17px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#52667f}.h{font:700 20px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#10233f}.p{font:400 16px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#35516d}.small{font:400 14px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#55708b}.n{font:700 18px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#fff}.tag{font:700 14px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#1b5f7a}.line{stroke:#7295b3;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#a4b7c9;stroke-width:2;stroke-dasharray:7 7;fill:none}.box{stroke-width:2}.label{font:600 15px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#2d4861}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7295b3"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f7fbff"/>
  <text x="70" y="68" class="title">LingBot-Map: 장면 전체를 저장하지 않고, 역할이 다른 세 가지 기하 메모리를 둔다</text>
  <text x="70" y="102" class="sub">Geometric Context Attention (GCA) · 현재 프레임당 compact state를 읽어 pose와 depth를 추정</text>
  <rect x="70" y="145" width="220" height="270" rx="20" fill="#e7f4ff" stroke="#47a1d8" class="box"/>
  <circle cx="105" cy="185" r="18" fill="#2e9bd4"/><text x="99" y="192" class="n">t</text>
  <text x="135" y="192" class="h">새 입력 프레임</text>
  <rect x="95" y="220" width="170" height="112" rx="12" fill="#fff" stroke="#8ac7e8"/>
  <path d="M113 309 L151 269 L177 295 L197 250 L245 309 Z" fill="#a7d9ee"/><circle cx="186" cy="248" r="13" fill="#ffcc66"/>
  <text x="105" y="370" class="p">ViT 특징 추출</text><text x="105" y="394" class="small">frame attention ↔ GCA</text>
  <rect x="382" y="142" width="315" height="130" rx="18" fill="#fff4df" stroke="#efa943" class="box"/>
  <circle cx="414" cy="179" r="17" fill="#e79a26"/><text x="408" y="186" class="n">1</text>
  <text x="447" y="183" class="h">Anchor context</text>
  <text x="414" y="216" class="p">처음/기준 view를 붙들어</text><text x="414" y="240" class="p">좌표계·scale의 기준점으로 사용</text>
  <rect x="382" y="300" width="315" height="130" rx="18" fill="#e8f8ee" stroke="#51b781" class="box"/>
  <circle cx="414" cy="337" r="17" fill="#33a66a"/><text x="408" y="344" class="n">2</text>
  <text x="447" y="341" class="h">Pose-reference window</text>
  <text x="414" y="374" class="p">최근의 pose reference로</text><text x="414" y="398" class="p">가까운 view의 dense geometry를 유지</text>
  <rect x="382" y="458" width="315" height="130" rx="18" fill="#f1ecff" stroke="#8c76d5" class="box"/>
  <circle cx="414" cy="495" r="17" fill="#7960c7"/><text x="408" y="502" class="n">3</text>
  <text x="447" y="499" class="h">Trajectory memory</text>
  <text x="414" y="532" class="p">전체 경로를 compact token으로 압축해</text><text x="414" y="556" class="p">먼 거리 drift를 교정하는 단서로 사용</text>
  <path d="M290 235 C330 235 335 205 375 205" class="line"/><path d="M290 280 C330 280 340 365 375 365" class="line"/><path d="M290 325 C335 325 345 525 375 525" class="line"/>
  <rect x="785" y="224" width="340" height="260" rx="22" fill="#112d4d"/>
  <text x="808" y="275" style="font:700 18px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#fff">Geometric Context Attention</text>
  <text x="822" y="309" style="font:400 16px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#c5d8e8">세 context를 current-view feature에</text><text x="822" y="333" style="font:400 16px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#c5d8e8">선택적으로 결합하는 learned attention</text>
  <rect x="822" y="365" width="122" height="72" rx="12" fill="#1c567d"/><text x="843" y="394" style="font:700 16px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#fff">Camera pose</text><text x="858" y="419" style="font:400 14px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#d8e7f0">P(t)</text>
  <rect x="968" y="365" width="122" height="72" rx="12" fill="#1c567d"/><text x="997" y="394" style="font:700 16px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#fff">Depth map</text><text x="1008" y="419" style="font:400 14px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#d8e7f0">D(t)</text>
  <path d="M697 207 C738 207 742 270 778 290" class="line"/><path d="M697 365 C735 365 750 350 778 350" class="line"/><path d="M697 523 C735 523 740 418 778 410" class="line"/>
  <path d="M145 647 H1060" class="dash"/>
  <text x="70" y="680" class="label">핵심 해석</text><text x="165" y="680" class="small">전체 과거 frame을 모두 보관하는 대신, 기준점 · local geometry · long-range drift correction을 서로 다른 state로 분리한다.</text>
</svg>