<svg xmlns="http://www.w3.org/2000/svg" width="600" height="860" viewBox="0 0 600 860" role="img" aria-labelledby="title desc">
  <title id="title">Jev의 System One 판단 인터페이스</title>
  <desc id="desc">애플리케이션의 구조화된 상태와 Noul·Choice·Score 질문이 Jev를 거쳐 타입과 확률 응답으로 반환되고, 코드가 분기·정렬·에스컬레이션을 결정하는 세로 구조도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9eabc4"/></marker>
    <style>
      .h{font:700 28px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#f7f8fc}
      .t{font:700 21px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#f7f8fc}
      .s{font:400 16px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#c9d2e3}
      .b{font:700 14px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#171c2a}
    </style>
  </defs>
  <rect width="600" height="860" rx="28" fill="#101522"/>
  <text x="48" y="61" class="h">Jev: 생성 대신 코드용 판단을 반환</text>
  <text x="48" y="91" class="s">System One 모델은 좁은 질문을 타입·확률 응답으로 바꾼다</text>

  <path d="M300 245 L300 300" stroke="#9eabc4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M300 445 L300 500" stroke="#9eabc4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M300 645 L300 700" stroke="#9eabc4" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="62" y="130" width="476" height="115" rx="20" fill="#1d3557" stroke="#73b4ff" stroke-width="2"/>
  <rect x="88" y="153" width="73" height="28" rx="14" fill="#a8ceff"/><text x="105" y="173" class="b">입력</text>
  <text x="185" y="177" class="t">구조화된 상태</text>
  <text x="185" y="209" class="s">텍스트 · JSON · 애플리케이션 기록</text>

  <rect x="62" y="300" width="476" height="145" rx="20" fill="#3c2b5f" stroke="#c49bff" stroke-width="2"/>
  <rect x="88" y="323" width="73" height="28" rx="14" fill="#e1c5ff"/><text x="105" y="343" class="b">질문</text>
  <text x="185" y="347" class="t">코드가 정의한 좁은 판단</text>
  <text x="185" y="379" class="s">Noul: 예·아니요 확률 · Choice: 선택지 확률</text>
  <text x="185" y="407" class="s">Score: 정의한 등급의 확률 가중 점수</text>

  <rect x="62" y="500" width="476" height="145" rx="20" fill="#174a4b" stroke="#63d6c8" stroke-width="2"/>
  <rect x="88" y="523" width="73" height="28" rx="14" fill="#a8ece3"/><text x="105" y="543" class="b">판단</text>
  <text x="185" y="547" class="t">Jev의 병렬 타입 응답</text>
  <text x="185" y="579" class="s">사전 정의한 스키마 안의 값과 확률 분포</text>
  <text x="185" y="607" class="s">Choice·Score에는 confidence도 함께 반환</text>

  <rect x="62" y="700" width="476" height="105" rx="20" fill="#5a3a20" stroke="#f3b36a" stroke-width="2"/>
  <rect x="88" y="723" width="73" height="28" rx="14" fill="#ffd4a5"/><text x="105" y="743" class="b">제어</text>
  <text x="185" y="747" class="t">코드가 다음 행동을 결정</text>
  <text x="185" y="779" class="s">분기 · 정렬 · 라우팅 · 사람 검토로 에스컬레이션</text>

  <text x="62" y="836" class="s">핵심 경계: 타입은 보장해도 판단의 사실 정확성은 별도로 검증해야 한다.</text>
</svg>
