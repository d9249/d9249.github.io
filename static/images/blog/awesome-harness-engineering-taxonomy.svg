    <rect x="512" y="377" width="56" height="40" rx="20" fill="#7c3aed"/><text class="pill" x="540" y="403" font-size="19" text-anchor="middle">12</text>
  </g>
  <g>
    <rect x="46" y="474" width="548" height="104" rx="16" fill="#dcfce7"/>
    <rect x="46" y="474" width="12" height="104" rx="6" fill="#16a34a"/>
