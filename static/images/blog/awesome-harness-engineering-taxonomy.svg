<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1320" viewBox="0 0 640 1320" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Harness Engineering의 8개 큐레이션 영역</title>
  <desc id="desc">141개 자료를 학습, 기반 개념, 컨텍스트와 메모리, 안전한 자율성, 명세와 워크플로, 평가와 관측성, 벤치마크, 런타임과 하네스로 나눈 세로형 분류 지도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <style>
      .title{font-family:Arial,'Apple SD Gothic Neo',sans-serif;font-weight:700;fill:#f8fafc}
      .sub{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#cbd5e1}
      .label{font-family:Arial,'Apple SD Gothic Neo',sans-serif;font-weight:700;fill:#12203d}
      .small{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#475569}
      .pill{font-family:Arial,'Apple SD Gothic Neo',sans-serif;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="640" height="1320" rx="28" fill="url(#bg)"/>
  <text class="title" x="46" y="68" font-size="32">Awesome Harness Engineering</text>
  <text class="sub" x="46" y="102" font-size="18">모델 밖의 실행 환경을 설계하는 8개 읽기 축</text>
  <rect x="46" y="132" width="548" height="70" rx="16" fill="#1e40af"/>
  <text class="pill" x="72" y="161" font-size="18">2026년 8월 README 기준</text>
  <text class="pill" x="472" y="161" font-size="18" text-anchor="middle">141개 리소스</text>
  <text class="sub" x="72" y="184" font-size="14">각 링크는 한 개의 가장 적합한 범주에만 배치</text>

