<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">RBE의 heavy ranker 호출 절감 후보 선택 흐름</title>
  <desc id="desc">오프라인에 support item과 CUR 인덱스를 구성하고, 온라인 query에서는 support item에만 heavy ranker를 호출한 뒤 전체 후보 점수를 근사하여 top-k 후보를 고르는 과정</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f7"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1b2838" flood-opacity="0.14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52718a"/></marker>
    <style>
      .kicker{font:700 22px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1px;fill:#52718a}.title{font:700 42px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#162b3c}.small{font:500 21px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#526777}.cardtitle{font:700 28px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#142a3b}.body{font:500 22px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#3d5668}.tag{font:700 19px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#fff}.note{font:500 18px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#607583}
    </style>
  </defs>
  <rect width="1400" height="720" fill="url(#bg)"/>
  <rect x="48" y="42" width="1304" height="636" rx="28" fill="#fff" stroke="#d9e4eb" stroke-width="2"/>
  <text x="92" y="96" class="kicker">RELEVANCE-BASED EMBEDDINGS · CANDIDATE RETRIEVAL</text>
  <text x="92" y="150" class="title">무거운 ranker를 ‘전체 검색’ 대신 ‘지원 점수’에 쓴다</text>
  <text x="92" y="190" class="small">전체 후보의 relevance를 매번 계산하지 않고, 소수 support item 점수에서 CUR 근사로 후보를 복원한다.</text>
  <rect x="92" y="235" width="250" height="36" rx="18" fill="#657b8d"/><text x="217" y="260" text-anchor="middle" class="tag">오프라인 · 인덱스 구성</text>
  <rect x="452" y="235" width="250" height="36" rx="18" fill="#147d86"/><text x="577" y="260" text-anchor="middle" class="tag">온라인 · query 처리</text>
  <rect x="1060" y="235" width="206" height="36" rx="18" fill="#336aa6"/><text x="1163" y="260" text-anchor="middle" class="tag">후보 전달</text>
  <g filter="url(#shadow)"><rect x="92" y="300" width="270" height="242" rx="20" fill="#f6f9fb" stroke="#cbd9e2" stroke-width="2"/></g>
  <text x="122" y="352" class="cardtitle">1. support item 선택</text>
  <text x="122" y="396" class="body">대표성 있는 항목을</text><text x="122" y="427" class="body">clustering·greedy 등으로 선택</text><text x="122" y="477" class="note">선택 방식은 실험 변수</text><text x="122" y="505" class="note">(저장소에 여러 variant 포함)</text>
  <g filter="url(#shadow)"><rect x="92" y="572" width="270" height="66" rx="16" fill="#e9f0f5" stroke="#cbd9e2" stroke-width="2"/></g><text x="227" y="614" text-anchor="middle" class="cardtitle">CUR 근사 인덱스</text>
  <path d="M 362 421 H 430" stroke="#52718a" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="452" y="300" width="280" height="242" rx="20" fill="#e9f8f6" stroke="#9ed4cd" stroke-width="2"/></g>
  <text x="482" y="352" class="cardtitle">2. heavy ranker 호출</text>
  <text x="482" y="396" class="body">새 query × support item만</text><text x="482" y="427" class="body">정확한 relevance 점수 계산</text><text x="482" y="477" class="note">전체 corpus에 대한 호출은</text><text x="482" y="505" class="note">후보 단계에서 피함</text>
  <path d="M 732 421 H 800" stroke="#52718a" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="822" y="300" width="280" height="242" rx="20" fill="#eef4fb" stroke="#b7cfe9" stroke-width="2"/></g>
  <text x="852" y="352" class="cardtitle">3. 전체 점수 근사</text>
  <text x="852" y="396" class="body">support 점수와 CUR factor로</text><text x="852" y="427" class="body">전체 item relevance를 추정</text><text x="852" y="477" class="note">근사 오차와 후보 recall을</text><text x="852" y="505" class="note">분리해 측정해야 함</text>
  <path d="M 1102 421 H 1170" stroke="#52718a" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1192" y="300" width="140" height="242" rx="20" fill="#edf3fb" stroke="#9dbce0" stroke-width="2"/></g>
  <text x="1262" y="365" text-anchor="middle" class="cardtitle">4. top-k</text><text x="1262" y="410" text-anchor="middle" class="body">후보만</text><text x="1262" y="441" text-anchor="middle" class="body">다음 단계로</text><text x="1262" y="487" text-anchor="middle" class="note">필요하면</text><text x="1262" y="513" text-anchor="middle" class="note">정밀 재정렬</text>
  <path d="M 227 542 V 562" stroke="#52718a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="450" y="616" class="note">핵심: ranker 품질을 버리는 대신, 호출 위치를 support item으로 압축한다.</text>
</svg>
