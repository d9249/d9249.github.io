<svg xmlns="http://www.w3.org/2000/svg" width="700" height="690" viewBox="0 0 700 690" role="img" aria-labelledby="title desc">
  <title id="title">J-Space 추론 시점 제어 구조</title>
  <desc id="desc">작업 복잡도에서 fast, full, loop 게이트를 거쳐 필요한 모듈을 선택적으로 읽고, 상태와 검증을 외부화한 뒤 사용자 산출물로 이어지는 J-Space의 공개 구현 구조도. 모델 가중치는 변경하지 않는다.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#153965"/><stop offset="1" stop-color="#245f89"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#10223a" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f638a"/></marker>
    <style>
      .title{font:700 25px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#fff}
      .sub{font:400 14px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#d8e8f4}
      .h{font:700 17px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#17324d}
      .b{font:400 14px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#42607a}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#35536e}
      .chip{font:700 12px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1a6074}
      .note{font:600 13px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#775211}
    </style>
  </defs>
  <rect width="700" height="690" fill="#f5f8fb"/>
  <rect x="26" y="24" width="648" height="102" rx="20" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="54" y="67" class="title">J-Space: 모델 밖에서 작동하는 작업 제어층</text>
  <text x="54" y="94" class="sub">선택적 문서 로딩 · 상태 외부화 · 검증 규칙</text>
  <rect x="500" y="55" width="143" height="39" rx="19.5" fill="#d8f2e8"/>
  <text x="571.5" y="80" text-anchor="middle" class="chip">가중치 변경 없음</text>

  <path d="M350 191 L350 218" stroke="#2f638a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="170" y="144" width="360" height="48" rx="14" fill="#fff" stroke="#b8cce0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="174" text-anchor="middle" class="h">작업 복잡도와 실패 위험을 먼저 분류</text>

  <path d="M350 293 L350 320" stroke="#2f638a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="62" y="220" width="576" height="74" rx="16" fill="#e8f2fa" stroke="#b8cce0" stroke-width="1.5"/>
  <text x="350" y="249" text-anchor="middle" class="h">fast · full · loop 게이트</text>
  <text x="350" y="274" text-anchor="middle" class="b">한눈에 검증 가능한 작업부터 여러 단계·파일·세션을 잇는 작업까지</text>

  <path d="M350 410 L350 438" stroke="#2f638a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="62" y="321" width="576" height="89" rx="16" fill="#fff" stroke="#b8cce0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="92" y="354" class="h">필요한 모듈만 선택적으로 로드</text>
  <text x="92" y="380" class="b">용량 · 공유 기준 · 중간 단계 · 자기 점검 · 경험적 검증</text>
  <rect x="473" y="347" width="132" height="34" rx="17" fill="#e8f5ef"/>
  <text x="539" y="369" text-anchor="middle" class="chip">문서 1개 또는 2개</text>

  <path d="M350 540 L350 567" stroke="#2f638a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="62" y="438" width="576" height="102" rx="16" fill="#f0f5ff" stroke="#b8cce0" stroke-width="1.5"/>
  <text x="92" y="472" class="h">상태와 확인 근거를 외부화</text>
  <text x="92" y="498" class="b">목표 · 핵심 제약 · 확인된 사실 · 열린 질문 · 다음 행동</text>
  <text x="92" y="522" class="small">선택형 jspace.py는 .jspace/에 기록만 남기며 해결책을 대신 고르지 않는다</text>

  <rect x="62" y="567" width="576" height="68" rx="16" fill="#173d5f" filter="url(#shadow)"/>
  <text x="92" y="596" class="title" style="font-size:18px">검증 범위를 명시한 사용자 산출물</text>
  <text x="92" y="619" class="sub">문서·코드·테스트 결과를 같은 작업 흐름 안에서 확인</text>

  <rect x="62" y="652" width="576" height="26" rx="10" fill="#fff3cf"/>
  <text x="350" y="670" text-anchor="middle" class="note">구조 검사와 단위 테스트 통과는 구현 품질의 근거이며, 벤치마크 효과는 별도 재현이 필요하다</text>
</svg>
